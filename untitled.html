<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora & Conversor de Divisas VZLA</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #34d399;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --btn-bg: #334155;
            --btn-hover: #475569;
            --btn-op: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sync-btn {
            background: #0f172a;
            border: 1px solid var(--btn-bg);
            color: var(--accent-blue);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sync-btn:active {
            transform: scale(0.95);
        }

        .sync-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            margin-bottom: 10px;
        }

        .rates-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .rate-card {
            background-color: #0f172a;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .rate-title {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .rate-val {
            font-size: 0.85rem;
            font-weight: 700;
            margin: 2px 0;
        }

        .rate-card.usd .rate-val { color: var(--accent-blue); }
        .rate-card.eur .rate-val { color: var(--accent-purple); }
        .rate-card.usdt .rate-val { color: var(--accent-green); }

        .gap-badge {
            font-size: 0.65rem;
            color: #fbbf24;
        }

        .display-area {
            background-color: #0f172a;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .curr-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .curr-chip {
            flex: 1;
            padding: 4px;
            font-size: 0.75rem;
            border: none;
            border-radius: 8px;
            background: #1e293b;
            color: var(--text-muted);
            cursor: pointer;
        }

        .curr-chip.active {
            background: var(--btn-op);
            color: #fff;
            font-weight: 700;
        }

        .main-val {
            font-size: 1.8rem;
            font-weight: 700;
            word-break: break-all;
            min-height: 2.2rem;
        }

        .equiv-val {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn {
            background-color: var(--btn-bg);
            color: var(--text-light);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .btn:active {
            background-color: var(--btn-hover);
            transform: scale(0.98);
        }

        .btn-op {
            background-color: var(--btn-op);
        }

        .btn-clear {
            background-color: #e11d48;
        }

        .btn-eq {
            background-color: var(--accent-green);
            color: #0f172a;
            grid-column: span 2;
        }

        .donate-section {
            margin-top: 10px;
            text-align: center;
        }

        .donate-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-body {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent-green);
        }

        .pm-item {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .copy-btn {
            background: var(--btn-bg);
            border: none;
            color: var(--accent-blue);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .close-btn {
            width: 100%;
            background: #334155;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">🧮 VZLA Calc</div>
        <button class="sync-btn" onclick="fetchRates()">🔄 Actualizar</button>
    </div>
    
    <div class="sync-status" id="syncStatus">Cargando tasas en vivo...</div>

    <div class="rates-grid">
        <div class="rate-card usd">
            <div class="rate-title">USD BCV</div>
            <div class="rate-val" id="rateUsd">--.--</div>
        </div>
        <div class="rate-card eur">
            <div class="rate-title">EUR BCV</div>
            <div class="rate-val" id="rateEur">--.--</div>
        </div>
        <div class="rate-card usdt">
            <div class="rate-title">USDT P2P</div>
            <div class="rate-val" id="rateUsdt">--.--</div>
            <div class="gap-badge" id="gapBadge">Brecha: --%</div>
        </div>
    </div>

    <div class="display-area">
        <div class="curr-selector">
            <button class="curr-chip active" onclick="setCurrency('VES', this)">VES (Bs)</button>
            <button class="curr-chip" onclick="setCurrency('USD', this)">USD ($)</button>
            <button class="curr-chip" onclick="setCurrency('EUR', this)">EUR (€)</button>
            <button class="curr-chip" onclick="setCurrency('USDT', this)">USDT (₮)</button>
        </div>
        <div class="main-val" id="display">0</div>
        <div class="equiv-val" id="equivDisplay">0.00 USD | 0.00 EUR | 0.00 USDT</div>
    </div>

    <div class="keypad">
        <button class="btn btn-clear" onclick="clearAll()">C</button>
        <button class="btn" onclick="deleteLast()">⌫</button>
        <button class="btn btn-op" onclick="appendOp('%')">%</button>
        <button class="btn btn-op" onclick="appendOp('/')">÷</button>

        <button class="btn" onclick="appendNum('7')">7</button>
        <button class="btn" onclick="appendNum('8')">8</button>
        <button class="btn" onclick="appendNum('9')">9</button>
        <button class="btn btn-op" onclick="appendOp('*')">×</button>

        <button class="btn" onclick="appendNum('4')">4</button>
        <button class="btn" onclick="appendNum('5')">5</button>
        <button class="btn" onclick="appendNum('6')">6</button>
        <button class="btn btn-op" onclick="appendOp('-')">-</button>

        <button class="btn" onclick="appendNum('1')">1</button>
        <button class="btn" onclick="appendNum('2')">2</button>
        <button class="btn" onclick="appendNum('3')">3</button>
        <button class="btn btn-op" onclick="appendOp('+')">+</button>

        <button class="btn" onclick="appendNum('0')">0</button>
        <button class="btn" onclick="appendNum('.')">.</button>
        <button class="btn btn-eq" onclick="calculate()">=</button>
    </div>

    <div class="donate-section">
        <button class="donate-btn" onclick="openModal()">❤️ Apoyar al Creador (Pago Móvil)</button>
    </div>
</div>

<div class="modal-overlay" id="pmModal">
    <div class="modal-body">
        <div class="modal-title">Apoyo al Creador</div>
        <div class="pm-item">
            <span><strong>Banco:</strong> Venezuela (0102)</span>
        </div>
        <div class="pm-item">
            <span><strong>Teléfono:</strong> 04125662200</span>
            <button class="copy-btn" onclick="copyText('04125662200')">Copiar</button>
        </div>
        <div class="pm-item">
            <span><strong>Cédula:</strong> 25663092</span>
            <button class="copy-btn" onclick="copyText('25663092')">Copiar</button>
        </div>
        <button class="close-btn" onclick="closeModal()">Cerrar</button>
    </div>
</div>

<script>
    let rates = { USD: 896.12, EUR: 1004.96, USDT: 1017.12 };
    let currentInput = '0';
    let activeCurrency = 'VES';

    async function fetchRates() {
        const statusEl = document.getElementById('syncStatus');
        statusEl.innerText = 'Actualizando tasas...';
        try {
            const res = await fetch('https://ve.dolarapi.com/v1/dolares');
            const data = await res.json();
            
            const bcv = data.find(d => d.codigo === 'oficial') || data[0];
            const usdt = data.find(d => d.codigo === 'paralelo') || data[1];

            if(bcv) rates.USD = bcv.promedio;
            if(usdt) rates.USDT = usdt.promedio;
            rates.EUR = rates.USD * 1.08; // Aproximación EUR si no disponible

            updateUI();
            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            statusEl.innerText = `Actualizado en vivo (${now})`;
        } catch (e) {
            statusEl.innerText = 'Usando tasas de respaldo/caché';
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('rateUsd').innerText = rates.USD.toFixed(2);
        document.getElementById('rateEur').innerText = rates.EUR.toFixed(2);
        document.getElementById('rateUsdt').innerText = rates.USDT.toFixed(2);

        const gap = ((rates.USDT - rates.USD) / rates.USD) * 100;
        document.getElementById('gapBadge').innerText = `Brecha: +${gap.toFixed(1)}%`;
        updateEquivalences();
    }

    function setCurrency(curr, btn) {
        activeCurrency = curr;
        document.querySelectorAll('.curr-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        updateEquivalences();
    }

    function appendNum(num) {
        if (currentInput === '0' && num !== '.') currentInput = num;
        else currentInput += num;
        document.getElementById('display').innerText = currentInput;
        updateEquivalences();
    }

    function appendOp(op) {
        currentInput += ` ${op} `;
        document.getElementById('display').innerText = currentInput;
    }

    function clearAll() {
        currentInput = '0';
        document.getElementById('display').innerText = currentInput;
        updateEquivalences();
    }

    function deleteLast() {
        currentInput = currentInput.trim();
        currentInput = currentInput.slice(0, -1);
        if (currentInput === '') currentInput = '0';
        document.getElementById('display').innerText = currentInput;
        updateEquivalences();
    }

    function calculate() {
        try {
            let expr = currentInput.replace(/×/g, '*').replace(/÷/g, '/').replace(/%/g, '/100');
            let res = eval(expr);
            currentInput = String(Number(res.toFixed(2)));
            document.getElementById('display').innerText = currentInput;
            updateEquivalences();
        } catch {
            document.getElementById('display').innerText = 'Error';
        }
    }

    function updateEquivalences() {
        let val = parseFloat(currentInput) || 0;
        let vesVal = 0;

        if (activeCurrency === 'VES') vesVal = val;
        else if (activeCurrency === 'USD') vesVal = val * rates.USD;
        else if (activeCurrency === 'EUR') vesVal = val * rates.EUR;
        else if (activeCurrency === 'USDT') vesVal = val * rates.USDT;

        let usd = vesVal / rates.USD;
        let eur = vesVal / rates.EUR;
        let usdt = vesVal / rates.USDT;
        let ves = vesVal;

        if (activeCurrency === 'VES') {
            document.getElementById('equivDisplay').innerText = `${usd.toFixed(2)} USD | ${eur.toFixed(2)} EUR | ${usdt.toFixed(2)} USDT`;
        } else {
            document.getElementById('equivDisplay').innerText = `Bs. ${ves.toFixed(2)} VES`;
        }
    }

    function openModal() { document.getElementById('pmModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('pmModal').style.display = 'none'; }
    function copyText(txt) { navigator.clipboard.writeText(txt); alert('¡Copiado!'); }

    window.onload = fetchRates;
</script>
</body>
</html>
